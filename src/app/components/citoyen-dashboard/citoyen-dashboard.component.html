<div class="citoyen-dashboard">
  <header>
    <h1>Mes Demandes</h1>
    <button class="btn-logout" (click)="logout()">Déconnexion</button>
  </header>

  <button class="btn-create" (click)="showCreateForm = !showCreateForm">
    {{showCreateForm ? 'Annuler' : '+ Nouvelle Demande'}}
  </button>

  <div *ngIf="showCreateForm" class="form-box">
    <h2>Créer une Demande</h2>
    <form (ngSubmit)="creerDemande()">
      <textarea [(ngModel)]="nouvelleDemande.description" name="desc" placeholder="Description du problème" required></textarea>
      <button type="submit">Soumettre</button>
    </form>
  </div>

  <div class="demandes-list">
    <div *ngFor="let d of demandes" class="demande-card">
      <h3>Demande #{{d.id}}</h3>
      <p>{{d.description}}</p>
      <span class="status">{{d.etat}}</span>
    </div>
  </div>
</div>
